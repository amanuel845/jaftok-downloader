<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 24px;
    color: #1a1a1a;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: #000;
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; opacity: 0.7; font-size: 14px; }
  .form {
    padding: 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: #667eea; }
  button {
    padding: 14px 24px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #5568d3; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { padding: 0 24px; font-size: 14px; min-height: 20px; }
  .status.error { color: #dc2626; }
  .result { padding: 0 24px 24px; display: none; }
  .result.show { display: block; }
  .video-info {
    display: flex;
    gap: 16px;
    padding: 16px;
    background: #f9fafb;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .video-info img {
    width: 100px;
    height: 133px;
    border-radius: 8px;
    object-fit: cover;
    background: #e5e7eb;
  }
  .video-info .meta { flex: 1; min-width: 0; }
  .video-info h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }
  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
  }
  .field label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6b7280;
    margin-bottom: 6px;
  }
  .field .value { display: flex; gap: 8px; align-items: center; }
  .field code {
    flex: 1;
    padding: 10px 12px;
    background: #f3f4f6;
    border-radius: 8px;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .field button { padding: 10px 14px; font-size: 13px; }
  .downloads { display: flex; gap: 10px; margin-top: 8px; }
  .btn-download {
    flex: 1;
    padding: 14px;
    background: #10b981;
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    transition: filter 0.15s;
  }
  .btn-download.audio { background: #f59e0b; }
  .btn-download:hover { filter: brightness(0.95); }
  .expiry {
    font-size: 12px;
    color: #6b7280;
    text-align: center;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎵 TikTok Downloader</h1>
    <p>Paste a vt.tiktok.com short link</p>
  </header>

  <div class="form">
    <input type="text" id="urlInput"
           placeholder="https://vt.tiktok.com/..."
           autocomplete="off" spellcheck="false">
    <button id="goBtn">Extract</button>
  </div>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="video-info">
      <img id="thumb" alt="">
      <div class="meta">
        <h3 id="title"></h3>
      </div>
    </div>

    <div class="field">
      <label>Video ID</label>
      <div class="value">
        <code id="videoId"></code>
        <button onclick="copyText('videoId')">Copy</button>
      </div>
    </div>

    <div class="downloads">
      <a id="dlVideo" class="btn-download" target="_blank" rel="noopener">
        ⬇ Video (no watermark)
      </a>
      <a id="dlAudio" class="btn-download audio" target="_blank" rel="noopener">
        🎵 Audio (MP3)
      </a>
    </div>

    <div class="expiry">⏱ Links expire in ~20 minutes</div>
  </div>
</div>

<script>
const API = 'https://btch-downloader-api-green.vercel.app/api/download/tiktok';

const urlInput = document.getElementById('urlInput');
const goBtn = document.getElementById('goBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '');
}

/**
 * The proxy token hides a URL like:
 *   https://v16.tokcdn.com/.../7690458172183547156_original.mp4...
 * The token has a short header, then a base64 payload. We try every
 * alignment offset until the decoded text reveals the video ID.
 */
function extractVideoId(videoUrl) {
  try {
    const token = new URL(videoUrl).searchParams.get('token');
    if (!token) return null;

    for (let offset = 0; offset < 24; offset++) {
      let s = token.substring(offset).replace(/[^A-Za-z0-9+/]/g, '');
      s = s.substring(0, s.length - (s.length % 4));
      try {
        const decoded = atob(s);
        const m = decoded.match(/(\d{15,25})_original\.mp4/);
        if (m) return m[1];
      } catch (e) { /* keep trying */ }
    }
    // Fallback: any long digit run in the decoded text
    for (let offset = 0; offset < 24; offset++) {
      let s = token.substring(offset).replace(/[^A-Za-z0-9+/]/g, '');
      s = s.substring(0, s.length - (s.length % 4));
      try {
        const m = atob(s).match(/(\d{17,25})/);
        if (m) return m[1];
      } catch (e) { /* keep trying */ }
    }
  } catch (e) { /* ignore */ }
  return null;
}

async function extract() {
  const url = urlInput.value.trim();
  if (!url) {
    setStatus('Please paste a TikTok link first.', true);
    return;
  }

  goBtn.disabled = true;
  goBtn.textContent = '...';
  setStatus('Fetching…');
  resultEl.classList.remove('show');

  try {
    const res = await fetch(`${API}?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    if (!json.success || !json.normalized?.media?.length) {
      throw new Error(json.message || 'No media returned for that link.');
    }

    const media = json.normalized.media;
    const video = media.find(m => m.type === 'video');
    const audio = media.find(m => m.type === 'audio');
    if (!video) throw new Error('No video URL returned.');

    const videoId = extractVideoId(video.url) || '—';

    document.getElementById('title').textContent =
      json.normalized.title || '(no title)';
    document.getElementById('thumb').src = json.normalized.thumbnail || '';
    document.getElementById('videoId').textContent = videoId;

    document.getElementById('dlVideo').href = video.url;

    const dlAudio = document.getElementById('dlAudio');
    if (audio) {
      dlAudio.href = audio.url;
      dlAudio.style.display = '';
    } else {
      dlAudio.style.display = 'none';
    }

    resultEl.classList.add('show');
    setStatus('Done ✓');
  } catch (err) {
    setStatus('Error: ' + err.message, true);
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Extract';
  }
}

function copyText(id) {
  const el = document.getElementById(id);
  const original = el.textContent;
  navigator.clipboard.writeText(original).then(() => {
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = original; }, 800);
  });
}

goBtn.addEventListener('click', extract);
urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') extract();
});
</script>
</body>
</html>
